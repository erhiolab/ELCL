<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-labelledby="title desc">
  <title id="title">ELCLC 核心模块</title>
  <desc id="desc">版本清单、加载器和数据存储连接到 ELCLC 核心</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#29445a" stroke-width="0.7" opacity=".48"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142a3c"/>
      <stop offset="1" stop-color="#0a1725"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1e5575"/>
      <stop offset="1" stop-color="#143149"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="22" y="28" width="456" height="344" rx="20" fill="#80ceff" opacity=".14" filter="url(#glow)"/>
  <rect x="22" y="28" width="456" height="344" rx="20" fill="url(#panel)" stroke="#41657b" stroke-width="1.3"/>
  <rect x="23" y="29" width="454" height="342" rx="19" fill="url(#grid)"/>

  <circle cx="46" cy="51" r="3" fill="#80ceff"/>
  <circle cx="59" cy="51" r="3" fill="#55778c"/>
  <circle cx="72" cy="51" r="3" fill="#55778c"/>
  <text x="445" y="55" text-anchor="end" fill="#7897aa" font-family="Consolas,monospace" font-size="10" letter-spacing="2">SYSTEM MAP</text>

  <path d="M250 163V121H143V150M250 121H357V150M250 241V279" fill="none" stroke="#4d9ac4" stroke-width="1.5"/>
  <circle cx="250" cy="121" r="3" fill="#80ceff"/>
  <circle cx="143" cy="150" r="3" fill="#80ceff"/>
  <circle cx="357" cy="150" r="3" fill="#80ceff"/>
  <circle cx="250" cy="279" r="3" fill="#80ceff"/>

  <rect x="75" y="150" width="136" height="50" rx="9" fill="#102537" stroke="#44657b"/>
  <path d="M93 175h13m-9-5v10" stroke="#80ceff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="116" y="179" fill="#c8e8fa" font-family="Consolas,monospace" font-size="12" letter-spacing="1.2">VERSIONS</text>

  <rect x="289" y="150" width="136" height="50" rx="9" fill="#102537" stroke="#44657b"/>
  <path d="m307 170 7 5-7 5m12-10-7 5 7 5" fill="none" stroke="#80ceff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="329" y="179" fill="#c8e8fa" font-family="Consolas,monospace" font-size="12" letter-spacing="1.2">LOADERS</text>

  <rect x="169" y="279" width="162" height="50" rx="9" fill="#102537" stroke="#44657b"/>
  <path d="M190 299h12v12h-12zM190 303h12" fill="none" stroke="#80ceff" stroke-width="1.5"/>
  <text x="215" y="309" fill="#c8e8fa" font-family="Consolas,monospace" font-size="12" letter-spacing="1.2">STORAGE</text>

  <rect x="195" y="163" width="110" height="78" rx="12" fill="#80ceff" opacity=".25" filter="url(#glow)"/>
  <rect x="195" y="163" width="110" height="78" rx="12" fill="url(#core)" stroke="#80ceff" stroke-width="1.5"/>
  <text x="250" y="195" text-anchor="middle" fill="#f0faff" font-family="Consolas,monospace" font-size="20" font-weight="700" letter-spacing="1.5">ELCLC</text>
  <text x="250" y="217" text-anchor="middle" fill="#80ceff" font-family="Consolas,monospace" font-size="9" letter-spacing="2">CORE / 0.0.1</text>

  <text x="45" y="348" fill="#7897aa" font-family="Consolas,monospace" font-size="10" letter-spacing="1.2">ERHIOLAB CRAFT LAUNCHER</text>
  <text x="455" y="348" text-anchor="end" fill="#80ceff" font-family="Consolas,monospace" font-size="10">NET 10.0</text>
</svg>
