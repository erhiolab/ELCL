name: Publish ELCL and ELCLC

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        if: ${{ !github.event.deleted }}
        runs-on: windows-2025
        permissions:
            contents: read
        steps:
            - name: Check out the tagged source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up .NET 10
              uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
              with:
                  dotnet-version: 10.0.x
            - name: Build binaries and generate release notes
              shell: pwsh
              run: ./tools/publish-elcl.ps1 -ReleaseTag $env:GITHUB_REF_NAME -Repository $env:GITHUB_REPOSITORY
            - name: Upload the release bundle
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-bundle
                  path: |
                      artifacts/publish/ELCL-*-win-x64-framework-dependent.exe
                      artifacts/publish/ELCL-*-win-x64-self-contained.exe
                      artifacts/publish/ErhioLab.Craft.Launcher.Core.dll
                      artifacts/publish/SHA256SUMS.txt
                      artifacts/publish/release-notes.md
                  if-no-files-found: error
                  compression-level: 0

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download the release bundle
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release-bundle
                  path: release
            - name: Verify checksums and publish GitHub Release
              working-directory: release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  sha256sum --check --strict SHA256SUMS.txt
                  version="${GITHUB_REF_NAME#v}"
                  gh release create "$GITHUB_REF_NAME" \
                    "ELCL-$version-win-x64-framework-dependent.exe" \
                    "ELCL-$version-win-x64-self-contained.exe" \
                    ErhioLab.Craft.Launcher.Core.dll SHA256SUMS.txt \
                    --repo "$GITHUB_REPOSITORY" --verify-tag \
                    --title "$GITHUB_REF_NAME" --notes-file release-notes.md
