name: BUG 反馈
description: 报告崩溃、错误提示或与预期不符的行为。
title: "[BUG] "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              请先搜索已有 Issues。一个 Issue 尽量只报告一个问题，方便复现和跟进。
              这里的内容是公开的。上传日志或截图前，请遮住账户信息、访问令牌、设备代码、API 密钥和不想公开的个人路径。不要上传整个配置或账户文件。
    - type: dropdown
      id: component
      attributes:
          label: 问题出现在哪里？
          options:
              - ELCL 启动器
              - ELCLC 核心库
              - 官网、文档或发布文件
              - 不确定
      validations:
          required: true
    - type: input
      id: version
      attributes:
          label: 版本或提交号
          description: 启动器可在「更多 → 关于」查看版本。从源码构建时请填写 Git 提交号；网站问题可填写页面地址。
          placeholder: 例如 0.0.1 或 Git 提交号
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: 怎样复现？
          description: 从打开哪个页面或调用哪个方法开始，按顺序列出操作，并说明每次都会发生还是偶尔发生。
          placeholder: |
              1. 打开……
              2. 选择……
              3. 点击……后出现问题（每次／偶尔）。
      validations:
          required: true
    - type: textarea
      id: result
      attributes:
          label: 实际结果和预期结果
          description: 写出看到的现象或错误提示，以及正常情况下应该发生什么。
          placeholder: |
              实际：……
              预期：……
      validations:
          required: true
    - type: textarea
      id: environment
      attributes:
          label: 运行环境
          description: 只填写与问题有关的信息。启动器崩溃可提供 Windows 版本、启动器下载版本；启动游戏可提供 Minecraft、加载器和 Java 版本；核心库问题可提供 .NET 版本与调用方式。
          placeholder: |
              Windows 11；ELCL 自带运行时版
              Minecraft 1.21.1；NeoForge 21.1.265；Java 21
    - type: textarea
      id: evidence
      attributes:
          label: 日志、截图或最小复现代码
          description: 启动器日志在 ELCL/logs；游戏崩溃时可附该版本的日志。请截取出错前后的部分，或上传已脱敏的文本文件。没有日志时也可以提交。
